# Render blueprint: New > Blueprint in the Render dashboard, pick this repository, fill in the
# three values it asks for. The free plan sleeps after 15 minutes without traffic (the next visit
# takes about a minute) and its disk is not kept, so saved trips reset when it restarts.
services:
  - type: web
    name: ai-travel-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_CODE # the access code visitors must enter
        sync: false
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_API_KEY
        sync: false
      - key: AGENT_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_MIN_INTERVAL
        value: "1"
      - key: USER_DAILY_MESSAGES
        value: "30"
      - key: GLOBAL_DAILY_MESSAGES
        value: "200"
